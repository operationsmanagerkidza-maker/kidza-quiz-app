```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Kidza Staff Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#e53935;
    --red-dark:#b71c1c;
    --light:#fff5f5;
    --white:#ffffff;
    --border:#f1d6d6;
    --text:#1a1a1a;
    --muted:#777;
    --success:#198754;
    --danger:#dc3545;
    --radius:18px;
}

body{
    font-family:'Nunito',sans-serif;
    background:#faf7f7;
    color:var(--text);
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.brand-header{
    background:var(--red);
    overflow:hidden;
    border-radius:0 0 28px 28px;
    margin-bottom:20px;
}

.brand-header img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
}

.card{
    background:#fff;
    margin:0 16px 18px;
    padding:22px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.page-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:8px;
    font-family:'Poppins',sans-serif;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
}

input{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid var(--border);
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:var(--red);
}

.btn{
    border:none;
    padding:13px 20px;
    border-radius:50px;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--red);
    color:#fff;
}

.btn-outline{
    background:#fff;
    border:2px solid var(--red);
    color:var(--red);
}

.btn-full{
    width:100%;
}

.row{
    display:flex;
    gap:10px;
}

.option{
    border:2px solid var(--border);
    padding:14px;
    border-radius:14px;
    margin-bottom:12px;
    cursor:pointer;
    transition:.2s;
    font-weight:700;
}

.option:hover{
    border-color:var(--red);
    background:var(--light);
}

.option.selected{
    background:var(--light);
    border-color:var(--red);
}

.option.correct{
    background:#e8fff1;
    border-color:var(--success);
}

.option.wrong{
    background:#fff0f0;
    border-color:var(--danger);
}

.progress{
    height:8px;
    background:#f3d7d7;
    border-radius:50px;
    overflow:hidden;
    margin-bottom:18px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:var(--red);
    transition:.3s;
}

.timer{
    background:var(--light);
    color:var(--red);
    padding:10px 18px;
    border-radius:50px;
    font-weight:800;
    font-size:18px;
}

.question{
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
    line-height:1.5;
}

.score-circle{
    width:150px;
    height:150px;
    border-radius:50%;
    border:6px solid var(--red);
    margin:20px auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--light);
}

.score-circle h1{
    color:var(--red);
    font-size:48px;
}

.review-item{
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
}

.review-correct{
    background:#e8fff1;
    border-left:4px solid var(--success);
}

.review-wrong{
    background:#fff0f0;
    border-left:4px solid var(--danger);
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:var(--red);
    color:#fff;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.badge{
    padding:5px 10px;
    border-radius:50px;
    font-size:12px;
    font-weight:700;
}

.pass{
    background:#e8fff1;
    color:var(--success);
}

.fail{
    background:#fff0f0;
    color:var(--danger);
}

.hidden{
    display:none;
}

.center{
    text-align:center;
}

.mb1{
    margin-bottom:12px;
}

.mb2{
    margin-bottom:20px;
}

.mt2{
    margin-top:20px;
}

</style>
</head>

<body>

<!-- LANDING -->

<div class="screen active" id="landing-screen">

    <div class="brand-header">
        <img src="Banner.jpeg" alt="Kidza Banner">
    </div>

    <div class="card">

        <div class="center mb2">
            <div class="page-title">Kidza Staff Quiz</div>
            <div class="subtitle">Training & Knowledge Assessment</div>
        </div>

        <div class="mb2">
            <label>Staff Name</label>
            <input type="text" id="staff-name" placeholder="Enter your name">
        </div>

        <button class="btn btn-primary btn-full" onclick="startQuiz()">
            ▶ Start Quiz
        </button>

        <div class="mt2 row">
            <button class="btn btn-outline btn-full" onclick="showLeaderboard()">
                🏆 Leaderboard
            </button>

            <button class="btn btn-outline btn-full" onclick="showAdminLogin()">
                🔐 Admin
            </button>
        </div>

    </div>

</div>

<!-- QUIZ -->

<div class="screen" id="quiz-screen">

    <div class="brand-header">
        <img src="Banner.jpeg" alt="Kidza Banner">
    </div>

    <div class="card">

        <div class="row mb2" style="justify-content:space-between;align-items:center;">
            <div>
                <div style="font-size:14px;color:var(--muted);">
                    Staff
                </div>

                <div style="font-weight:800;font-size:18px;" id="staff-display">
                </div>
            </div>

            <div class="timer">
                ⏱ <span id="timer">30</span>
            </div>
        </div>

        <div class="progress">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="mb2">
            <b id="question-count"></b>
        </div>

        <div class="question" id="question-text">
        </div>

        <div id="options-container">
        </div>

        <button class="btn btn-primary btn-full mt2 hidden" id="next-btn" onclick="nextQuestion()">
            Next Question →
        </button>

    </div>

</div>

<!-- RESULT -->

<div class="screen" id="result-screen">

    <div class="brand-header">
        <img src="Banner.jpeg" alt="Kidza Banner">
    </div>

    <div class="card center">

        <div style="font-size:60px;">
            🎉
        </div>

        <div class="page-title">
            Quiz Completed
        </div>

        <div class="score-circle">
            <h1 id="final-score">0</h1>
            <small id="total-score">/ 0</small>
        </div>

        <div class="mb2">
            Percentage:
            <b id="percentage"></b>
        </div>

        <div id="pass-status"></div>

    </div>

    <div class="card">

        <div class="page-title" style="font-size:18px;">
            Answer Review
        </div>

        <div id="review-container"></div>

    </div>

    <div class="card">
        <button class="btn btn-primary btn-full" onclick="goHome()">
            ↩ Back to Home
        </button>
    </div>

</div>

<!-- LEADERBOARD -->

<div class="screen" id="leaderboard-screen">

    <div class="brand-header">
        <img src="Banner.jpeg" alt="Kidza Banner">
    </div>

    <div class="card">

        <div class="page-title">
            🏆 Leaderboard
        </div>

        <div id="leaderboard-list"></div>

        <div class="mt2">
            <button class="btn btn-outline btn-full" onclick="goHome()">
                ← Back
            </button>
        </div>

    </div>

</div>

<!-- ADMIN LOGIN -->

<div class="screen" id="admin-login-screen">

    <div class="brand-header">
        <img src="Banner.jpeg" alt="Kidza Banner">
    </div>

    <div class="card">

        <div class="page-title">
            🔐 Admin Login
        </div>

        <div class="mb2">
            <label>Password</label>
            <input type="password" id="admin-password">
        </div>

        <button class="btn btn-primary btn-full" onclick="adminLogin()">
            Login
        </button>

        <div class="mt2">
            <button class="btn btn-outline btn-full" onclick="goHome()">
                ← Back
            </button>
        </div>

    </div>

</div>

<!-- ADMIN PANEL -->

<div class="screen" id="admin-screen">

    <div class="brand-header">
        <img src="Banner.jpeg" alt="Kidza Banner">
    </div>

    <div class="card">

        <div class="row mb2">

            <button class="btn btn-primary btn-full" onclick="showResults()">
                📊 Results
            </button>

            <button class="btn btn-outline btn-full" onclick="exportCSV()">
                ⬇ Export
            </button>

        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="results-table"></tbody>

            </table>

        </div>

        <div class="mt2">
            <button class="btn btn-outline btn-full" onclick="goHome()">
                ← Logout
            </button>
        </div>

    </div>

</div>

<script>

const STORAGE_KEY = 'kidza_quiz_data';

let data = {
    adminPassword:'kidza2024',
    timer:30,

    questions:[
        {
            question:'What is the Kidza return policy?',
            options:['7 Days','14 Days','30 Days','No Return'],
            answer:2
        },

        {
            question:'Which certification is required for baby products?',
            options:['ISO','ISI','BIS','FDA'],
            answer:2
        },

        {
            question:'Which age group uses newborn diapers?',
            options:['0-3 Months','1-2 Years','3-5 Years','5+ Years'],
            answer:0
        }
    ],

    results:[]
};

function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadData(){

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
        data = JSON.parse(saved);
    }
}

loadData();

let state = {
    current:0,
    score:0,
    answers:[],
    timer:null,
    timeLeft:30,
    name:''
};

function showScreen(id){

    document.querySelectorAll('.screen').forEach(screen=>{
        screen.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    window.scrollTo(0,0);
}

function startQuiz(){

    const name = document.getElementById('staff-name').value.trim();

    if(!name){
        alert('Please enter your name');
        return;
    }

    state.name = name;
    state.current = 0;
    state.score = 0;
    state.answers = [];

    document.getElementById('staff-display').textContent = name;

    showScreen('quiz-screen');

    loadQuestion();
}

function loadQuestion(){

    clearInterval(state.timer);

    const q = data.questions[state.current];

    document.getElementById('question-count').textContent =
        `Question ${state.current + 1} of ${data.questions.length}`;

    document.getElementById('question-text').textContent =
        q.question;

    const progress =
        ((state.current) / data.questions.length) * 100;

    document.getElementById('progress-fill').style.width =
        progress + '%';

    const container =
        document.getElementById('options-container');

    container.innerHTML = '';

    q.options.forEach((opt,index)=>{

        const div = document.createElement('div');

        div.className = 'option';

        div.innerHTML = opt;

        div.onclick = ()=>selectOption(index);

        container.appendChild(div);
    });

    document.getElementById('next-btn').classList.add('hidden');

    startTimer();
}

function startTimer(){

    state.timeLeft = data.timer;

    document.getElementById('timer').textContent =
        state.timeLeft;

    state.timer = setInterval(()=>{

        state.timeLeft--;

        document.getElementById('timer').textContent =
            state.timeLeft;

        if(state.timeLeft <= 0){

            clearInterval(state.timer);

            autoNext();
        }

    },1000);
}

function selectOption(index){

    clearInterval(state.timer);

    const q = data.questions[state.current];

    const options =
        document.querySelectorAll('.option');

    options.forEach(opt=>{
        opt.style.pointerEvents = 'none';
    });

    if(index === q.answer){

        state.score++;

        options[index].classList.add('correct');

    }else{

        options[index].classList.add('wrong');

        options[q.answer].classList.add('correct');
    }

    state.answers.push({
        question:q.question,
        selected:index,
        correct:q.answer
    });

    document.getElementById('next-btn')
        .classList.remove('hidden');
}

function autoNext(){

    state.answers.push({
        question:data.questions[state.current].question,
        selected:-1,
        correct:data.questions[state.current].answer
    });

    nextQuestion();
}

function nextQuestion(){

    state.current++;

    if(state.current >= data.questions.length){

        finishQuiz();

    }else{

        loadQuestion();
    }
}

function finishQuiz(){

    const total = data.questions.length;

    const pct =
        Math.round((state.score / total) * 100);

    const passed = pct >= 60;

    data.results.unshift({
        name:state.name,
        score:state.score,
        total:total,
        pct:pct,
        passed:passed,
        date:new Date().toLocaleString()
    });

    saveData();

    document.getElementById('final-score').textContent =
        state.score;

    document.getElementById('total-score').textContent =
        '/ ' + total;

    document.getElementById('percentage').textContent =
        pct + '%';

    document.getElementById('pass-status').innerHTML =
        passed
        ? '<span class="badge pass">PASSED</span>'
        : '<span class="badge fail">FAILED</span>';

    renderReview();

    showScreen('result-screen');
}

function renderReview(){

    const wrap =
        document.getElementById('review-container');

    wrap.innerHTML = '';

    state.answers.forEach((ans,index)=>{

        const q = data.questions[index];

        const correct =
            ans.selected === ans.correct;

        const div =
            document.createElement('div');

        div.className =
            correct
            ? 'review-item review-correct'
            : 'review-item review-wrong';

        div.innerHTML = `
            <b>Q${index+1}.</b>
            ${q.question}
            <br><br>

            Your Answer:
            ${
                ans.selected >= 0
                ? q.options[ans.selected]
                : 'Not Answered'
            }

            <br>

            Correct Answer:
            ${q.options[ans.correct]}
        `;

        wrap.appendChild(div);
    });
}

function showLeaderboard(){

    const wrap =
        document.getElementById('leaderboard-list');

    if(data.results.length === 0){

        wrap.innerHTML =
            '<p>No results yet</p>';

    }else{

        const sorted =
            [...data.results]
            .sort((a,b)=>b.pct-a.pct);

        wrap.innerHTML = sorted.map((r,i)=>`

            <div class="card">

                <div class="row"
                     style="justify-content:space-between;align-items:center;">

                    <div>
                        <b>#${i+1} ${r.name}</b>
                        <div class="subtitle">
                            ${r.score}/${r.total}
                        </div>
                    </div>

                    <div style="font-size:24px;font-weight:800;color:var(--red);">
                        ${r.pct}%
                    </div>

                </div>

            </div>

        `).join('');
    }

    showScreen('leaderboard-screen');
}

function showAdminLogin(){
    showScreen('admin-login-screen');
}

function adminLogin(){

    const pass =
        document.getElementById('admin-password').value;

    if(pass === data.adminPassword){

        showResults();

        showScreen('admin-screen');

    }else{

        alert('Wrong password');
    }
}

function showResults(){

    const table =
        document.getElementById('results-table');

    table.innerHTML = '';

    data.results.forEach((r,index)=>{

        table.innerHTML += `

            <tr>
                <td>${index+1}</td>
                <td>${r.name}</td>
                <td>${r.score}/${r.total}</td>
                <td>
                    <span class="badge ${r.passed ? 'pass':'fail'}">
                        ${r.passed ? 'PASS':'FAIL'}
                    </span>
                </td>
            </tr>

        `;
    });
}

function exportCSV(){

    if(data.results.length === 0){
        alert('No results available');
        return;
    }

    let csv =
        'Name,Score,Total,Percentage,Status,Date\n';

    data.results.forEach(r=>{

        csv +=
            `${r.name},${r.score},${r.total},${r.pct}%,${r.passed?'PASS':'FAIL'},${r.date}\n`;
    });

    const blob =
        new Blob([csv], {type:'text/csv'});

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        'kidza_results.csv';

    a.click();
}

function goHome(){

    clearInterval(state.timer);

    showScreen('landing-screen');
}

</script>

</body>
</html>
```
